# CI for catalog-service: formatting check, build + Checkstyle, and tests.
# Runs only when files under services/catalog-service (or this workflow) change.
name: catalog-service CI

on:
  push:
    branches: [main]
    paths:
      - "services/catalog-service/**"
      - ".github/workflows/catalog-service.yml"
  pull_request:
    paths:
      - "services/catalog-service/**"
      - ".github/workflows/catalog-service.yml"
  workflow_dispatch: # allows a manual run from the Actions tab

# Cancel an older run on the same branch/PR when a newer commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: services/catalog-service

    # Throwaway Postgres for tests that start the Spring context (@SpringBootTest).
    # Flyway runs V1/V2 against it, so migrations are checked on every build too.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: catalogdb
          POSTGRES_USER: catalog
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catalog -d catalogdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: catalogdb
      DB_USERNAME: catalog
      DB_PASSWORD: ci-only-password

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/catalog-service/pom.xml

      - name: Check formatting (Spotless)
        run: ./mvnw -B -ntp spotless:check

      - name: Build, Checkstyle and tests
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-service-test-reports
          path: services/catalog-service/target/surefire-reports/
          if-no-files-found: ignore
