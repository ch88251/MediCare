services:
  catalog-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: catalogdb
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalogdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  catalog-service:
    build:
      context: ./services/catalog-service
      dockerfile: Dockerfile
    environment:
      DB_HOST: catalog-db
      DB_PORT: 5432
      DB_NAME: catalogdb
      DB_USERNAME: catalog
      DB_PASSWORD: ${CATALOG_DB_PASSWORD}
    ports:
      - "8081:8080"
    depends_on:
      catalog-db:
        condition: service_healthy

volumes:
  catalog-db-data:
